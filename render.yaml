# Render.com — Blueprint do Totem Cookies & Cia.
# Recursos criados automaticamente no primeiro sync:
#   1. cookies-cia-totem → site estático (PWA / frontend)
#   2. cookies-cia-api   → web service Node (API de pedidos)
#   3. cookies-db        → PostgreSQL free (banco de dados)

services:
  # ---------- 1. FRONTEND: PWA estático ----------
  - type: web
    name: cookies-cia-totem
    runtime: static
    buildCommand: echo "Site estático — sem build necessário"
    staticPublishPath: .
    headers:
      # Garante que o service worker seja atualizado corretamente
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json

  # ---------- 2. BACKEND: API de pedidos ----------
  - type: web
    name: cookies-cia-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cookies-db
          property: connectionString

# ---------- 3. BANCO: PostgreSQL free ----------
databases:
  - name: cookies-db
    databaseName: cookiesdb
    user: cookies_app
    plan: free
